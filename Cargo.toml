[workspace]
members = [
  "crates/mesh-core",
  "crates/mesh-protocol",
  "crates/mesh-node",
  "crates/mesh-testkit",
  "crates/mesh-control",
  "crates/mesh-cli",
  "apps/desktop/src-tauri"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.98"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.41", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
iroh = "=1.0.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread", "time"] }
zeroize = { version = "1.8.1", features = ["derive"] }

[profile.dev.package.scrypt]
opt-level = 3
