name: Local MVP integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.1
          cache: pnpm
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: pnpm install --frozen-lockfile
      - name: Verify local D1 persistence and authentication
        run: pnpm --filter @arcane-commons/api test:d1
      - name: Run isolated three-node verification
        run: pnpm verify:mvp
      - name: Verify the Arcane Commons v1 protocol journey
        run: pnpm verify:commons
      - name: Upload non-secret diagnostic evidence on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verify-mvp-diagnostics
          path: .verify/verify-mvp-report.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: verify-commons-diagnostics
          path: .verify/verify-commons-report.json
          if-no-files-found: warn
          retention-days: 7
