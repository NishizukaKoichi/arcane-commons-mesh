name: Release CLI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.archive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: acmctl-macos-apple-silicon
            executable: acmctl
          - os: macos-15
            target: x86_64-apple-darwin
            archive: acmctl-macos-intel
            executable: acmctl
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: acmctl-linux-x86_64
            executable: acmctl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: acmctl-windows-x86_64
            executable: acmctl.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          key: release-${{ matrix.target }}
      - name: Build acmctl
        run: cargo build --locked --release -p arcane-mesh-cli --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" release/
          cp LICENSE README.md release/
          tar -C release -czf "${{ matrix.archive }}.tar.gz" .
          shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" release/
          Copy-Item LICENSE, README.md release/
          Compress-Archive -Path release/* -DestinationPath "${{ matrix.archive }}.zip"
          $hash = (Get-FileHash "${{ matrix.archive }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}.zip" | Set-Content -NoNewline "${{ matrix.archive }}.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          assets=(artifacts/**/*.{tar.gz,zip,sha256})
          test "${#assets[@]}" -eq 8
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "Arcane Commons Mesh $TAG" \
            --generate-notes
