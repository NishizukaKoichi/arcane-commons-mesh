name: Bug report
description: Report a reproducible non-security problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, Recovery Kits, passphrases, private keys, invite codes, or user data. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant check output
      description: Redact paths and sensitive values before posting.
